services:
  - type: web
    name: christ-embassy-kumasi1
    runtime: node
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pnpm install --no-frozen-lockfile && PORT=3000 BASE_PATH=/ pnpm --filter @workspace/church-portal build && pnpm --filter @workspace/api-server build
    preDeployCommand: node scripts/setup.mjs
    startCommand: node api-server/dist/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: church-db
          property: connectionString

databases:
  - name: church-db
    # Keep this aligned with the existing Render database. Render does not
    # allow a Blueprint sync to downgrade Basic-256mb to Free.
    plan: basic-256mb
    region: oregon
    databaseName: church_portal
    user: church_admin
